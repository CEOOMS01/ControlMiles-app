name: controlmiles
description: "Olympus Mont Systems LLC - ControlMiles Enterprise 2026"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.10.7
  flutter: ^3.24.0

# ============================================================
# DEPENDENCIES
# ============================================================

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- On-device OCR (odometer number recognition, google_mlkit --
  # no cloud API, no AI branding: this is text recognition, not AI) ---
  google_mlkit_text_recognition: ^0.15.0

  # --- Local storage ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4

  # --- IDs, hashing, utilities ---
  uuid: ^4.5.2
  crypto: ^3.0.3
  shared_preferences: ^2.5.4

  # --- GPS + background tracking ---
  # flutter_background_geolocation is a PAID plugin (one-time ~$300 license
  # for production release) -- REMOVED from this list 2026-09-15, not just
  # disabled from Dart. First attempt kept the dependency and just never
  # called its ready()/start(), assuming that made it inert -- WRONG,
  # confirmed live: its native Android side shows a "LICENSE VALIDATION
  # FAILURE" toast on every app launch regardless of whether Dart ever
  # touches the plugin (the plugin author himself, in
  # github.com/transistorsoft/flutter_background_geolocation issue #109:
  # "The toast is normal and expected. It means the plugin is alive." /
  # asked "Can I remove this toast in debug mode?" -- answer: "Not without
  # purchasing a license."). Merely being a dependency is enough to trigger
  # it, so the only real fix is removing the dependency, not gating it.
  #
  # The original integration (lib/tracking/engines/bg_geolocation_engine.dart)
  # is preserved verbatim at reference/bg_geolocation_engine.dart.txt (a
  # .txt extension keeps it out of `flutter analyze`/build entirely while
  # the package isn't a dependency). To reactivate once the license is
  # purchased: (1) uncomment the line below, (2) move
  # reference/bg_geolocation_engine.dart.txt back to
  # lib/tracking/engines/bg_geolocation_engine.dart, (3) restore the
  # BgGeolocationEngine branch in background_gps_service.dart (see that
  # file's own git history for the exact facade code), (4) flip
  # location_engine_config.dart's useBackgroundGeolocationPaidEngine to true.
  # flutter_background_geolocation: ^5.0.5
  tracelet: ^3.8.7
  geolocator:
  flutter_background_service: ^5.0.5
  permission_handler: ^12.0.1
  flutter_activity_recognition: ^4.0.0
  provider: ^6.1.1

  # --- Camera + images + EXIF ---
  camera: ^0.12.0
  image_picker: ^1.1.0
  exif: ^3.3.0
  # Client-side compression before upload (odometer evidence photos) --
  # previously raw camera bytes went straight to Storage with only a
  # post-hoc 50KB-8MB size gate that rejected instead of compressing.
  flutter_image_compress: ^2.5.1
  # Blur detection for odometer evidence photos (explicit user requirement,
  # 2026-09-18) -- already resolved transitively (flutter_image_compress's
  # own dependency chain) so this just makes it a direct, importable
  # dependency instead of pinning a brand-new one.
  image: ^4.9.2

  # --- Supabase ---
  supabase_flutter: ^2.5.6
  mime: ^2.0.0

  # --- PDF & Printing ---
  pdf: ^3.11.3
  printing: ^5.14.2
  intl: ^0.20.2
  device_info_plus: ^12.3.0

  # --- Connectivity (offline buffer sync check) ---
  connectivity_plus: ^7.0.0

  # --- Subscriptions (Stripe Checkout/Portal, opened externally -- no
  # card entry ever happens inside this app, see subscription_screen.dart) ---
  url_launcher: ^6.3.1

  # --- Local notifications (recordatorio de viaje olvidado + resumen semanal) ---
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.0
  # notification_service.dart imports timezone directly (TZDateTime/
  # getLocation/setLocalLocation) but only ever had it as a transitive dep
  # of flutter_local_notifications -- declaring it directly, pinned to
  # match the version already forced below in dependency_overrides.
  timezone: ^0.11.0

  # --- Fleet Phase 5: live map (OpenStreetMap tiles -- no API key/billing
  # account needed, unlike google_maps_flutter, which would have required
  # an external Google Cloud credential from the user before this could
  # even run) ---
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  # Was already present transitively (via flutter_test etc.) but declaring
  # it directly since fleet_live_map_screen.dart imports it for firstOrNull
  # -- relying on an undeclared transitive resolution isn't guaranteed by
  # the pub version solver.
  collection: ^1.19.0

  # --- Fleet safety (2026-09-18): real per-road speed limits instead of a
  # fixed ceiling, via OpenStreetMap's Overpass API -- free, keyless, same
  # "no external Google Cloud credential" reasoning as flutter_map above.
  # Was already present transitively; declared directly since
  # speed_limit_service.dart imports it.
  http: ^1.2.0

  # --- Fleet driver invite deep link (Sprint 1 close, 2026-09-09): first
  # deep-link infrastructure in this project -- Android App Links now
  # (controlmiles.com resolves), iOS Universal Links pending the user's
  # Apple Developer Team ID. app_links over uni_links: actively maintained,
  # single package for both platforms, initial-link + stream in one API.
  app_links: ^6.4.0

# ============================================================
# DEV DEPENDENCIES
# ============================================================

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

# ============================================================
# DEPENDENCY OVERRIDES
# ============================================================
# flutter_local_notifications 19.5.0 declara timezone: ^0.10.0, pero esa
# versión de timezone tiene su propio pubspec con sdk: ">=2.19.0 <3.0.0"
# — un límite superior desactualizado (nunca lo subieron para Dart 3) que
# choca directo con el sdk: ^3.10.7 de este proyecto y rompería `pub get`.
# timezone 0.11.0 corrige ese límite (sdk: ^3.10.0). flutter_local_notifications
# solo usa TZDateTime/getLocation/setLocalLocation de este paquete — ninguna
# de esas APIs cambió entre 0.10.x y 0.11.0, así que forzar la versión acá
# es seguro en la práctica aunque técnicamente "rompe" lo que declaró.
dependency_overrides:
  timezone: ^0.11.0
  # tracelet_platform_interface declares flutter_rust_bridge: ^2.12.0 (a
  # caret constraint), which let pub resolve the newer 2.13.0 -- but
  # flutter_rust_bridge requires EXACT version parity between the
  # pre-generated Rust-bridge code baked into tracelet_android's native
  # library (built against 2.12.0's codegen) and the Dart runtime package,
  # not just semver-compatible. Real crash found live on a physical device
  # (2026-09-15): "Bad state: tracelet_core's codegen version (2.12.0)
  # should be the same as runtime version (2.13.0)" -- TraceletEngine.
  # initialize() failed every time, so BackgroundGpsService.startTracking()
  # never confirmed the engine running, the trip start was aborted, yet the
  # native foreground-service notification could still appear from tracelet's
  # own partial init -- exactly the reported "notification shows tracking
  # active but nothing started." Pinning to the exact version the codegen
  # was built against is the correct fix here, not a workaround: a caret
  # constraint on a flutter_rust_bridge-based package is unsafe by
  # construction (see the error's own link,
  # cjycode.com/flutter_rust_bridge/guides/miscellaneous/upgrade/regular),
  # this override just enforces what tracelet_platform_interface itself
  # should have pinned exactly.
  flutter_rust_bridge: 2.12.0

# ============================================================
# FLUTTER CONFIG
# ============================================================

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# ============================================================
# APP ICON CONFIGURATION
# ============================================================

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # Apple App Store rejects an app icon with an alpha channel -- the
  # source PNG carries one (even though it's visually opaque), caught by
  # this tool's own warning the first time this ran against the newly
  # scaffolded ios/ project.
  remove_alpha_ios: true
  # 2026-09-15: launcher icon regenerated from the new official app icon
  # (originally provided as iconodelaaplicacion.png at the repo root,
  # preserved at store_assets/iconodelaaplicacion_original.png). That
  # source file already has its own background gradient + rounded
  # corners baked in -- correct for a Play Store listing image, but
  # wrong to feed directly into an adaptive-icon foreground (Android
  # would mask it a second time). Derived 3 clean assets from it instead
  # (glyph isolated by an R-channel ramp; the white corner artifacts
  # outside the rounded square removed by connected-component labelling
  # -- every white blob touching the image border is dropped, and the
  # glyph never touches the border. NOT PIL's ImageDraw.floodfill: that
  # is a silent no-op on a binary mask here, verified 2026-09-15 by
  # counting pixels before/after (337321 both times), which had left the
  # corner artifacts inside the "glyph"):
  #   - logo_controlmiles_launcher_foreground.png: the white
  #     pin+wheel+check glyph, transparent background, full detail
  #     (wheel spokes/center, checkmark) preserved, on a SQUARE
  #     1024x1024 canvas, glyph at 52% of canvas height, centered,
  #     aspect ratio preserved. Both properties matter:
  #       * square + aspect-preserved, because the tool resizes this
  #         asset directly to a square target -- the previous 657x861
  #         tight crop was STRETCHED to 432x432 (aspect 0.76 -> 1.00),
  #         visibly widening the pin on every Android launcher.
  #       * 52% of canvas, because Android only guarantees the central
  #         72dp of the 108dp canvas survives the OEM mask. Full-bleed
  #         (what it was before) got cropped by every circle mask.
  #     Since the safe-zone padding now lives in the ASSET, the <inset>
  #     that flutter_launcher_icons re-adds to
  #     mipmap-anydpi-v26/launcher_icon.xml must be removed after every
  #     regeneration -- see the comment in that file.
  #   - logo_controlmiles_launcher_background.png: the same diagonal
  #     blue gradient (sampled directly from the source, #0978EB to
  #     #0154CF), full-bleed, no rounding baked in -- Android applies
  #     its own adaptive-icon mask shape on top.
  #   - logo_controlmiles_launcher_flattened.png: the two composited
  #     together, opaque -- used for image_path (iOS + the legacy
  #     non-adaptive Android icon, neither of which get a separate
  #     foreground/background layer).
  # Deliberately separate from assets/images/logo_controlmiles.png,
  # which flutter_native_splash below still uses unchanged -- this was
  # scoped to the launcher icon only, not the splash screen.
  image_path: "assets/images/logo_controlmiles_launcher_flattened.png"
  adaptive_icon_background: "assets/images/logo_controlmiles_launcher_background.png"
  adaptive_icon_foreground: "assets/images/logo_controlmiles_launcher_foreground.png"

# ============================================================
# SPLASH SCREEN CONFIGURATION
# ============================================================

flutter_native_splash:
  color: "#F8FAFC"
  image: "assets/images/logo_controlmiles.png"

  android_12:
    image: "assets/images/logo_controlmiles.png"
    icon_background_color: "#F8FAFC"

  web: false
  fullscreen: true
